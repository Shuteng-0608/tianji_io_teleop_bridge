tianji_marvin_teleop_bridge:
  ros__parameters:
    robot_ip: "192.168.1.190"
    # Right-arm six-axis sensor; recording compatibility uses JointState name + effort.
    publish_right_ft_sensor: true
    right_ft_sensor_topic: "/io_teleop/right/ft_sensor"
    # REQUIRED: set this startup calibration.yaml path here or via launch right_ft_calibration_file:=...
    right_ft_calibration_file: ""
    right_ft_tare_directory: "/home/stw/ft_calibration_runs/teleop_tares"
    right_ft_tare_window_sec: 5.0
    # Measurement axes confirmed by manufacturer; no transform of the sensor origin.
    right_ft_sensor_frame_id: "right_ft_measurement"
    # Review-only by default: neither startup nor service preview writes tool parameters.
    # Empty path explicitly selects the bundled config/tools_cfg.json snapshot.
    tools_config_file: "/home/stw/TJ_FX_ROBOT_CONTRL_SDK/MarvinPlatform_EN/tools_cfg.json"
    tool_config_dry_run: true
    tool_config_timeout_sec: 2.0
    state_topic: "/io_teleop/joint_states"
    # Canonical effort is feedback joint torque; disturbance effort is separate.
    estimated_joint_disturbance_topic: "/tianji_marvin_teleop_bridge/estimated_joint_disturbance"
    # Legacy raw-disturbance topic and per-frame bias remain available for recording.
    raw_state_topic: "/io_teleop/joint_states_raw"
    # Manual left/right/both/zero_joint_torque; capture AFTER choosing tool and control mode.
    joint_zero_window_sec: 1.0
    joint_zero_max_std_nm: 0.05
    joint_zero_max_velocity_rad_s: 0.01
    joint_zero_max_position_range_rad: 0.005
    command_topic: "/io_teleop/joint_cmd"
    # Disabled by default: no Cartesian Wrench publishers or calculations are created.
    publish_cartesian_disturbance: false
    left_cartesian_disturbance_topic: "~/left/estimated_cartesian_disturbance"
    right_cartesian_disturbance_topic: "~/right/estimated_cartesian_disturbance"
    # Wrenches are computed at each flange by the Marvin M6 CCS 4.0 kinematics model.
    # Keep frame IDs empty until the corresponding URDF frame names/sign convention are confirmed.
    left_cartesian_disturbance_frame_id: ""
    right_cartesian_disturbance_frame_id: ""
    # Empty selects the validated ccs_m6_40.MvKDCfg installed with this package.
    kinematics_config_file: ""
    alignment_diagnostics_topic: "~/alignment_status"
    publish_rate_hz: 300.0
    # Control ceiling 100 Hz, paced from completion even if state publishing is raised.
    control_rate_hz: 100.0
    # Both retreat_left_10cm and retreat_right_10cm use this smooth-motion duration.
    retreat_duration_sec: 10.0
    alignment_diagnostics_rate_hz: 10.0
    feedback_timeout_sec: 0.2
    command_timeout_sec: 0.15
    # COMMAND_WAIT recovery tolerance; preserves mode/target while waiting for fresh input.
    command_recovery_alignment_rad: 0.10
    reconnect_period_sec: 2.0

    # Explicit motion permission and confirmations remain required; startup does not move.
    allow_motion: false
    # Startup-only; affects teleoperation, NOT initial-pose/retreat services.
    teleop_control_mode: "joint_impedance"  # joint_impedance or position (high stiffness)
    sdk_control_compatibility_confirmed: false
    tool_dynamics_confirmed: false
    enabled_arms: "both"  # Each retreat service controls ONLY its named arm.

    subscribe_joint_commands: true
    command_reference_timeout_sec: 0.2
    max_command_step_rad: 0.05
    initial_alignment_tolerance_rad: 0.05
    alignment_required_frames: 20
    joint_limit_tolerance_rad: 0.0001
    # IO applies URDF limits; teleoperation uses only a wider backup guard.
    teleop_soft_limits_enabled: false
    teleop_joint_limit_extension_rad: 0.02
    # Inset range for initial-pose/retreat and optional legacy soft holds.
    joint_limit_safety_margin_rad: 0.01
    # Teleoperation recovery inset applies only with teleop_soft_limits_enabled=true.
    soft_limit_release_margin_rad: 0.03
    soft_limit_recovery_alignment_rad: 0.10
    soft_limit_recovery_frames: 20
    # false freezes all enabled arms, preserving dual-arm coordination.
    soft_limit_allow_other_arm_motion: false
    max_following_error_rad: 0.25
    mode_transition_timeout_sec: 2.0
    # Marvin's official impedance example leaves 200 ms between control packets.
    sdk_packet_settle_sec: 0.25
    # 100 ms retry window. Tianji reports holding the last target without timeout exit.
    # Teleoperation expiry -> COMMAND_WAIT, not IDLE; recovery requires realignment.
    # Other SDK send errors and initial-pose/manual-stop fault handling are unchanged.
    sdk_target_busy_timeout_sec: 0.1
    hold_duration_sec: 0.5

    # One-shot initial-pose service target, in canonical joint order and degrees:
    # Joint1_L..Joint7_L, then Joint1_R..Joint7_R.
    initial_pose_deg: [90.0, -75.0, -90.0, -90.0, 0.0, 0.0, 0.0,
                       -90.0, -75.0, 90.0, -90.0, 0.0, 0.0, 0.0]
    initial_pose_tolerance_rad: 0.02
    initial_pose_required_frames: 20
    initial_pose_timeout_sec: 45.0
    # Independent controller percentages for move_to_initial_pose only.
    initial_pose_velocity_ratio: 10
    initial_pose_acceleration_ratio: 10

    # Soft, low-stiffness starting candidates. They are never applied while allow_motion=false.
    # K unit: N*m/deg. D is a dimensionless damping ratio.
    left_joint_stiffness:  [2.5, 2.5, 2.5, 2.0, 1.5, 1.2, 1.0]
    left_joint_damping:    [0.35, 0.35, 0.35, 0.30, 0.25, 0.25, 0.25]
    right_joint_stiffness: [2.5, 2.5, 2.5, 2.0, 1.5, 1.2, 1.0]
    right_joint_damping:   [0.35, 0.35, 0.35, 0.30, 0.25, 0.25, 0.25]
    # Controller percentage limits, also used during direct teleoperation.
    velocity_ratio: 50
    acceleration_ratio: 50

    expected_sdk_version: 100343014
    strict_sdk_version: true

    # Latest command wins: depth 1 avoids replaying stale targets after scheduling delays.
    state_qos_reliability: "reliable"
    command_qos_reliability: "best_effort"
    state_qos_depth: 10
    command_qos_depth: 1
    connect_on_start: true
