# Right FT sensor HUD; direction preview stays disabled until sensor/task mapping is defined.
# Legacy parameters: used only with launch input_source:=joint_estimate.
tianji_force_estimator:
  ros__parameters:
    state_topic: /tianji_marvin_teleop_bridge/estimated_joint_disturbance
    estimate_topic: /tianji_force_hud/estimates
    wrench_convention_confirmed: false
    # Per-arm SDK model-base labels, NOT camera frames or published TF transforms.
    left_wrench_frame: left_sdk_base
    right_wrench_frame: right_sdk_base

tianji_force_hud:
  ros__parameters:
    input_source: right_ft_sensor
    right_ft_topic: /io_teleop/right/ft_sensor
    right_ft_frame: right_ft_measurement
    display_mode: ring
    display_arms: right
    image_rate_hz: 100.0
    force_display_range: 20.0
    left_direction_mapping_confirmed: false
    left_direction_preview: false
    left_direction_frame: left_sdk_base
    # Identity projection of SDK force axes; no task/camera rotation or sign correction.
    left_screen_right_axis: [1.0, 0.0, 0.0]
    left_screen_up_axis: [0.0, 1.0, 0.0]
    left_axial_axis: [0.0, 0.0, 1.0]
    right_direction_mapping_confirmed: false
    right_direction_preview: false  # Old base-frame directions do not apply to sensor-frame data.
    right_direction_frame: right_ft_measurement
    # Placeholder sensor axes; not a base/camera/task mapping.
    right_screen_right_axis: [1.0, 0.0, 0.0]
    right_screen_up_axis: [0.0, 1.0, 0.0]
    right_axial_axis: [0.0, 0.0, 1.0]
